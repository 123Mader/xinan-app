name: Build APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

# 优化: 复用 runner 自带 Android SDK + Gradle 缓存, 构建提速 2-3 倍
# 旧版手动 wget commandlinetools 已移除 (脆弱且不可缓存)
jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true -Dorg.gradle.parallel=true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK (runner 自带, 仅补 license + 组件)
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0

      - name: Cache Gradle distribution
        uses: actions/cache@v4
        id: gradle-dist-cache
        with:
          path: /opt/gradle-8.9
          key: gradle-dist-8.9-${{ runner.os }}

      - name: Install Gradle 8.9 (AGP 8.5.2 需要 ≥ 8.7)
        if: steps.gradle-dist-cache.outputs.cache-hit != 'true'
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d /opt
          rm -f gradle-8.9-bin.zip

      - name: Add Gradle to PATH
        run: echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            android/.gradle
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/**/*.properties') }}
          restore-keys: gradle-deps-${{ runner.os }}-

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: xinan-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Build Release APK (unsigned)
        working-directory: android
        run: gradle assembleRelease --no-daemon || true

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xinan-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: warn
